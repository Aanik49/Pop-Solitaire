<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POP! SOLITAIRE</title>
    <!-- Google Fonts for authentic comic book typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --pop-cyan: #00D2FF;
            --pop-cyan-dark: #0095CC;
            --pop-yellow: #FFE600;
            --pop-red: #FF1E42;
            --pop-blue: #1D4ED8;
            --pop-magenta: #FF0099;
            --pop-white: #FFFFFF;
            --pop-black: #0D0D0D;
            --card-w: clamp(44px, 11.8vw, 108px);
            --card-h: calc(var(--card-w) * 1.4);
            --border-w: 3px;
            --card-radius: 10px;
            --card-shadow: 4px 4px 0px #0D0D0D;
            --card-shadow-hover: 6px 6px 0px #0D0D0D;
            --slot-bg: rgba(255, 253, 245, 0.68);
            --slot-border: #0D0D0D;
            --hud-bg: #FFE600;
            --hud-accent: #FF1E42;
            --hud-accent-text: #FFFFFF;
        }

        @media (min-width: 768px) {
            :root {
                --card-w: clamp(72px, 10.2vw, 112px);
                --border-w: 3.5px;
            }
        }

        /* =========================================================
           5 DISTINCT ARTISTIC STYLE THEME TOKENS
           ========================================================= */
        body[data-style="comic"] {
            background-color: #FFF6DC;
            background-image:
                radial-gradient(rgba(13, 13, 13, 0.055) 1.5px, transparent 1.6px),
                linear-gradient(155deg, #FFF7DF 0%, #FFEFA8 34%, #B8F0FF 72%, #8CE2FF 100%);
            background-size: 14px 14px, 100% 100%;
            --card-radius: 10px;
            --card-shadow: 4px 4px 0px #0D0D0D;
            --card-shadow-hover: 6px 6px 0px #0D0D0D;
            --slot-bg: rgba(255, 253, 245, 0.68);
            --hud-bg: #FFE600;
            --hud-accent: #FF1E42;
            --hud-accent-text: #FFFFFF;
        }

        body[data-style="warhol"] {
            background-color: #FF2E93;
            background-image:
                radial-gradient(rgba(13, 13, 13, 0.16) 2px, transparent 2.1px),
                linear-gradient(90deg, #FF47A3 0%, #FF47A3 50%, #00E5FF 50%, #00E5FF 100%);
            background-size: 12px 12px, 100% 100%;
            --card-radius: 4px;
            --card-shadow: 4px 4px 0px #FF0099, 7px 7px 0px #0D0D0D;
            --card-shadow-hover: 6px 6px 0px #00E5FF, 9px 9px 0px #0D0D0D;
            --slot-bg: rgba(255, 255, 255, 0.76);
            --hud-bg: #FFEB00;
            --hud-accent: #FF0099;
            --hud-accent-text: #FFFFFF;
        }

        body[data-style="memphis"] {
            background-color: #C9F7EB;
            background-image:
                radial-gradient(#FF7EB6 2px, transparent 2.1px),
                radial-gradient(#5CE1E6 2px, transparent 2.1px),
                linear-gradient(135deg, #FDE2E4 0%, #FFF1C9 48%, #C9F7EB 100%);
            background-size: 28px 28px, 28px 28px, 100% 100%;
            background-position: 0 0, 14px 14px, 0 0;
            --card-radius: 14px;
            --card-shadow: 4px 4px 0px #FF6B9D, 7px 7px 0px #0D0D0D;
            --card-shadow-hover: 6px 6px 0px #00C4B4, 9px 9px 0px #0D0D0D;
            --slot-bg: rgba(255, 255, 255, 0.78);
            --hud-bg: #A0E7E5;
            --hud-accent: #FF6B9D;
            --hud-accent-text: #FFFFFF;
        }

        body[data-style="street"] {
            background-color: #E7E2D8;
            background-image:
                radial-gradient(rgba(13, 13, 13, 0.09) 1.5px, transparent 1.6px),
                repeating-linear-gradient(-45deg, rgba(13,13,13,0.03) 0px, rgba(13,13,13,0.03) 6px, transparent 6px, transparent 18px),
                linear-gradient(180deg, #F4EFE6 0%, #DFD8CA 100%);
            background-size: 10px 10px, 100% 100%, 100% 100%;
            --card-radius: 7px;
            --card-shadow: 5px 5px 0px #0D0D0D;
            --card-shadow-hover: 7px 7px 0px #FF5500;
            --slot-bg: rgba(255, 250, 235, 0.75);
            --hud-bg: #FF5500;
            --hud-accent: #FFE600;
            --hud-accent-text: #0D0D0D;
        }

        body[data-style="manga"] {
            background-color: #FFF5F7;
            background-image:
                radial-gradient(rgba(255, 42, 109, 0.14) 1.6px, transparent 1.7px),
                linear-gradient(160deg, #FFF8FA 0%, #FFE3EC 52%, #E0F2FE 100%);
            background-size: 9px 9px, 100% 100%;
            --card-radius: 3px;
            --card-shadow: 4px 4px 0px #1E1B4B;
            --card-shadow-hover: 6px 6px 0px #FF2A6D;
            --slot-bg: rgba(255, 255, 255, 0.8);
            --hud-bg: #FFFFFF;
            --hud-accent: #FF2A6D;
            --hud-accent-text: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Comic Neue', cursive, sans-serif;
            background-color: #FFF6DC;
            /* Warm vintage comic-paper & sky-blue gradient base with subtle halftone grain */
            background-image: 
                radial-gradient(rgba(13, 13, 13, 0.055) 1.5px, transparent 1.6px),
                linear-gradient(155deg, #FFF7DF 0%, #FFEFA8 34%, #B8F0FF 72%, #8CE2FF 100%);
            background-size: 14px 14px, 100% 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Illustrated Multi-Layered Pop Art Tabletop Backdrop */
        #pop-art-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #pop-art-backdrop svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Subtle ambient drift on background Pop Art motifs */
        @keyframes popFloatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }
        .backdrop-float {
            animation: popFloatSlow 9s ease-in-out infinite;
            transform-origin: center;
        }

        .font-bangers {
            font-family: 'Bangers', cursive, sans-serif;
            letter-spacing: 0.05em;
        }

        /* Comic Outline Text */
        .comic-text-stroke {
            -webkit-text-stroke: 1.5px var(--pop-black);
            text-shadow: 2px 2px 0px var(--pop-black);
        }
        .comic-title-stroke {
            -webkit-text-stroke: 2px var(--pop-black);
            text-shadow: 3px 3px 0px var(--pop-black);
        }

        /* Comic Buttons & Panels */
        .pop-box {
            border: var(--border-w) solid var(--pop-black);
            box-shadow: 4px 4px 0px var(--pop-black);
        }

        .pop-btn {
            border: var(--border-w) solid var(--pop-black);
            box-shadow: 3px 3px 0px var(--pop-black);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            cursor: pointer;
        }

        .pop-btn:hover:not(:disabled) {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--pop-black);
        }

        .pop-btn:active:not(:disabled) {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px var(--pop-black);
        }

        .pop-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Board Layout */
        #game-board {
            flex: 1;
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2vh, 22px);
            position: relative;
            z-index: 10;
        }

        .top-row {
            display: grid;
            grid-template-columns: repeat(7, var(--card-w));
            justify-content: space-between;
            align-items: start;
            width: 100%;
        }

        .tableau-row {
            display: grid;
            grid-template-columns: repeat(7, var(--card-w));
            justify-content: space-between;
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* Card Slots */
        .card-slot {
            width: var(--card-w);
            height: var(--card-h);
            border-radius: var(--card-radius);
            border: var(--border-w) solid var(--pop-black);
            background-color: var(--slot-bg);
            backdrop-filter: blur(2px);
            box-shadow: inset 3px 3px 0px rgba(0, 0, 0, 0.16), 3px 3px 0px rgba(13, 13, 13, 0.35);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.15s ease, border-radius 0.2s ease;
        }

        .card-slot.highlight-target {
            background-color: var(--pop-yellow) !important;
            transform: scale(1.04);
            box-shadow: 0 0 0 4px var(--pop-magenta), 4px 4px 0px var(--pop-black);
        }

        .tableau-col {
            width: var(--card-w);
            height: 100%;
            position: relative;
        }

        .tableau-base-slot {
            width: var(--card-w);
            height: var(--card-h);
            border-radius: var(--card-radius);
            border: var(--border-w) dashed rgba(13, 13, 13, 0.62);
            background-color: rgba(255, 253, 245, 0.45);
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.5);
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Playing Card Styling */
        .playing-card {
            width: var(--card-w);
            height: var(--card-h);
            border-radius: var(--card-radius);
            border: var(--border-w) solid var(--pop-black);
            box-shadow: var(--card-shadow);
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--pop-white);
            cursor: grab;
            transition: box-shadow 0.12s ease, border-radius 0.2s ease;
            overflow: hidden;
            touch-action: none;
        }

        .playing-card:hover {
            box-shadow: var(--card-shadow-hover);
        }

        .playing-card.selected-card {
            box-shadow: 0 0 0 3px var(--pop-yellow), 6px 6px 0px var(--pop-black) !important;
            transform: translateY(-4px);
            z-index: 40 !important;
        }

        .playing-card.hint-card {
            box-shadow: 0 0 0 4px #00FF66, 6px 6px 0px var(--pop-black) !important;
            animation: hintPulse 0.75s ease-in-out infinite alternate;
            z-index: 45 !important;
        }

        @keyframes hintPulse {
            from { transform: translateY(0px) scale(1); }
            to { transform: translateY(-6px) scale(1.03); }
        }

        .playing-card.dragging {
            cursor: grabbing;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.85) !important;
            z-index: 9999 !important;
            pointer-events: none;
            transition: none !important;
        }

        /* Face-Down Pop Art Card Back (5 Style Variants) */
        .card-back {
            width: 100%;
            height: 100%;
            background-color: var(--pop-red);
            background-image: 
                radial-gradient(var(--pop-yellow) 24%, transparent 25%),
                radial-gradient(var(--pop-yellow) 24%, transparent 25%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-back.back-warhol {
            background-color: #FF0099;
            background-image:
                linear-gradient(90deg, #FF0099 50%, #00E5FF 50%),
                linear-gradient(0deg, rgba(255, 235, 0, 0.85) 50%, transparent 50%);
            background-size: 100% 100%, 100% 100%;
        }

        .card-back.back-memphis {
            background-color: #5CE1E6;
            background-image:
                radial-gradient(#FF6B9D 22%, transparent 23%),
                radial-gradient(#FFE600 22%, transparent 23%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        .card-back.back-street {
            background-color: #FFE600;
            background-image:
                repeating-linear-gradient(45deg, #0D0D0D 0px, #0D0D0D 3px, transparent 3px, transparent 11px),
                repeating-linear-gradient(-45deg, #FF5500 0px, #FF5500 3px, transparent 3px, transparent 11px);
        }

        .card-back.back-manga {
            background-color: #1E1B4B;
            background-image:
                radial-gradient(#FF2A6D 22%, transparent 23%),
                radial-gradient(#38BDF8 20%, transparent 21%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
        }

        .card-back-inner {
            width: 78%;
            height: 82%;
            border: 2.5px solid var(--pop-black);
            border-radius: 6px;
            background: var(--pop-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px var(--pop-black);
            position: relative;
            overflow: hidden;
        }

        .back-warhol .card-back-inner { background: #FFEB00; border-radius: 2px; }
        .back-memphis .card-back-inner { background: #FFFFFF; border-radius: 12px; }
        .back-street .card-back-inner { background: #FF1E42; border-radius: 4px; }
        .back-manga .card-back-inner { background: #FFF5F7; border-radius: 2px; }

        /* Card Front Colors & 5 Style Surface Variants */
        .suit-red {
            color: var(--pop-red);
        }
        .suit-black {
            color: var(--pop-black);
        }

        .card-front {
            width: 100%;
            height: 100%;
            background-color: #FFFDF7;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3px 4px;
        }

        /* Style 1: Comic Ben-Day Corner Halftone */
        .card-front.style-comic::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(0, 210, 255, 0.24) 20%, transparent 21%);
            background-size: 8px 8px;
            pointer-events: none;
        }
        .card-front.style-comic.is-red::before {
            background-image: radial-gradient(rgba(255, 230, 0, 0.42) 22%, transparent 23%);
        }

        /* Style 2: Andy Warhol Neon Silkscreen Duotone Tint */
        .card-front.style-warhol {
            background-color: #E0FCFF;
            border: 2px solid #00E5FF;
        }
        .card-front.style-warhol.is-red {
            background-color: #FFF0F8;
            border: 2px solid #FF0099;
        }
        .card-front.style-warhol::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(13, 13, 13, 0.12) 1.5px, transparent 1.6px);
            background-size: 6px 6px;
            pointer-events: none;
        }

        /* Style 3: Memphis 80s Pastel Band & Terrazzo Dots */
        .card-front.style-memphis {
            background: linear-gradient(180deg, #E3FDFD 0%, #FFFDF9 22%, #FFFDF9 78%, #FFE6F0 100%);
        }
        .card-front.style-memphis::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#5CE1E6 1.5px, transparent 1.6px), radial-gradient(#FF6B9D 1.5px, transparent 1.6px);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            opacity: 0.35;
            pointer-events: none;
        }

        /* Style 4: Neo-Pop Street Graffiti Marker & Spray Accent */
        .card-front.style-street {
            background-color: #FFFDF2;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 230, 0, 0.38) 0%, transparent 66%);
        }
        .card-front.style-street.is-red {
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 85, 0, 0.24) 0%, transparent 66%);
        }

        /* Style 5: Retro Japanese Manga Screentone & Corner Frame */
        .card-front.style-manga {
            background: linear-gradient(135deg, #FFFFFF 58%, #FCE7F3 100%);
        }
        .card-front.style-manga:not(.is-red) {
            background: linear-gradient(135deg, #FFFFFF 58%, #E0F2FE 100%);
        }
        .card-front.style-manga::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(30, 27, 75, 0.14) 1.3px, transparent 1.4px);
            background-size: 5px 5px;
            pointer-events: none;
        }

        /* Style Switcher Pill Bar */
        .style-pill {
            border: 2.5px solid #0D0D0D;
            box-shadow: 2px 2px 0px #0D0D0D;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
            cursor: pointer;
        }
        .style-pill:hover {
            transform: translateY(-1px);
            box-shadow: 3px 3px 0px #0D0D0D;
        }
        .style-pill.active-style {
            transform: translate(1px, 1px);
            box-shadow: 0px 0px 0px #0D0D0D, 0 0 0 2.5px #0D0D0D;
            background-color: #0D0D0D !important;
            color: #FFE600 !important;
        }

        .card-corner {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.92;
            z-index: 2;
            width: fit-content;
        }

        .card-corner-bottom {
            transform: rotate(180deg);
            align-self: flex-end;
        }

        .card-rank {
            font-family: 'Bangers', cursive, sans-serif;
            font-size: clamp(14px, 2.3vw, 24px);
            letter-spacing: 0.02em;
        }

        .card-mini-suit {
            width: clamp(10px, 1.5vw, 16px);
            height: clamp(10px, 1.5vw, 16px);
        }

        .card-center-art {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        /* Action Callout Popups (POW!, SNAP!, BAM!) */
        @keyframes comicPopBurst {
            0% {
                transform: translate(-50%, -50%) scale(0.15) rotate(-18deg);
                opacity: 0;
            }
            35% {
                transform: translate(-50%, -50%) scale(1.18) rotate(6deg);
                opacity: 1;
            }
            65% {
                transform: translate(-50%, -50%) scale(0.96) rotate(-3deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -85%) scale(1.08) rotate(2deg);
                opacity: 0;
            }
        }

        .comic-callout {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            animation: comicPopBurst 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 145px;
            height: 115px;
        }

        /* Stock Refresh Icon Spin */
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-8deg); }
            75% { transform: rotate(8deg); }
        }
        .stock-empty:hover {
            animation: wiggle 0.3s ease-in-out;
        }

        /* Win Screen Burst Animation */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .sunburst-spin {
            animation: spinSlow 18s linear infinite;
        }
    </style>
</head>
<body data-style="comic">

    <!-- Artistic Multi-Layered Pop Art Comic Tabletop Background (Dynamically Rendered per Style) -->
    <div id="pop-art-backdrop" aria-hidden="true"></div>

    <!-- Top Pop Art Comic Header HUD -->
    <header id="main-header" class="w-full bg-[#FFE600] border-b-4 border-[#0D0D0D] px-2 sm:px-4 py-1.5 flex flex-col gap-1.5 z-50 shadow-[0_4px_0_#0D0D0D] transition-colors duration-200">
        <!-- Row 1: Brand, Scoreboard & Controls -->
        <div class="w-full flex flex-wrap items-center justify-between gap-1.5 sm:gap-2">
            <!-- Brand Logo & Draw Mode Toggle -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <div id="brand-badge" class="bg-[#FF1E42] text-white font-bangers text-lg sm:text-2xl md:text-3xl px-2.5 py-0.5 rounded-lg border-[3px] border-[#0D0D0D] shadow-[3px_3px_0_#0D0D0D] -rotate-2 tracking-wider transition-colors duration-200">
                    POP! SOLITAIRE
                </div>
                <button id="btn-draw-mode" onclick="toggleDrawMode()" class="pop-btn bg-white text-[#0D0D0D] font-bangers text-xs sm:text-base px-2 sm:px-2.5 py-1 rounded-lg tracking-wide" title="Toggle Draw 1 / Draw 3">
                    DRAW 1
                </button>
            </div>

            <!-- Scoreboard Pills (Score, Moves & Timer) -->
            <div class="flex items-center gap-1.5 sm:gap-2.5">
                <div class="bg-white border-[3px] border-[#0D0D0D] rounded-lg px-2 py-0.5 sm:py-1 shadow-[3px_3px_0_#0D0D0D] flex items-center gap-1">
                    <span class="font-bangers text-xs sm:text-sm text-[#FF1E42] tracking-wide">SCORE</span>
                    <span id="score-display" class="font-bangers text-base sm:text-xl text-[#0D0D0D] leading-none">0</span>
                </div>
                <div class="bg-white border-[3px] border-[#0D0D0D] rounded-lg px-2 py-0.5 sm:py-1 shadow-[3px_3px_0_#0D0D0D] flex items-center gap-1">
                    <span class="font-bangers text-xs sm:text-sm text-[#1D4ED8] tracking-wide">MOVES</span>
                    <span id="move-count" class="font-bangers text-base sm:text-xl text-[#0D0D0D] leading-none">0</span>
                </div>
                <div class="bg-white border-[3px] border-[#0D0D0D] rounded-lg px-2 py-0.5 sm:py-1 shadow-[3px_3px_0_#0D0D0D] flex items-center gap-1">
                    <span class="font-bangers text-xs sm:text-sm text-[#FF0099] tracking-wide">TIME</span>
                    <span id="timer-display" class="font-bangers text-base sm:text-xl text-[#0D0D0D] leading-none">00:00</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <button id="btn-autocomplete" onclick="triggerAutoComplete()" class="hidden pop-btn bg-[#00FF66] text-[#0D0D0D] font-bangers text-sm sm:text-lg px-2.5 py-1 rounded-lg flex items-center gap-1 animate-bounce" title="Auto-Complete Game">
                    <span>⚡ FINISH!</span>
                </button>

            if (currentArtStyle === 'memphis') {
                return `<svg class="w-4/5 h-4/5" viewBox="0 0 60 60">
                    <polygon points="30,8 52,46 8,46" fill="#FF6B9D" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="round"/>
                    <circle cx="30" cy="32" r="10" fill="#FFE600" stroke="#0D0D0D" stroke-width="2.5"/>
                    <polyline points="12,52 21,46 30,52 39,46 48,52" fill="none" stroke="#0D0D0D" stroke-width="3" stroke-linecap="round"/>
                </svg>`;
            }
            if (currentArtStyle === 'street') {
                return `<svg class="w-4/5 h-4/5" viewBox="0 0 60 60">
                    <polygon points="10,44 10,20 23,32 30,14 37,32 50,20 50,44" fill="#FFE600" stroke="#0D0D0D" stroke-width="3.5" stroke-linejoin="round"/>
                    <line x1="30" y1="4" x2="30" y2="9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
                    <line x1="14" y1="8" x2="18" y2="12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
                    <line x1="46" y1="8" x2="42" y2="12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
                </svg>`;
            }
            if (currentArtStyle === 'manga') {
                return `<svg class="w-4/5 h-4/5" viewBox="0 0 60 60">
                    <circle cx="30" cy="24" r="14" fill="#FF2A6D" stroke="#1E1B4B" stroke-width="2.5"/>
                    <polygon points="8,50 30,22 52,50" fill="#38BDF8" stroke="#1E1B4B" stroke-width="3" stroke-linejoin="round"/>
                    <polygon points="22,32 30,22 38,32 34,35 30,31 26,35" fill="#FFFFFF"/>

            // Comic default
            return `<svg class="w-3/4 h-3/4" viewBox="0 0 60 60">
                <polygon points="30,3 37,20 56,20 41,32 46,50 30,39 14,50 19,32 4,20 23,20" fill="#FFE600" stroke="#0D0D0D" stroke-width="3.5" stroke-linejoin="round"/>
            </svg>`;
        }

        // ==========================================
        // 3. GAME STATE & HISTORY
        // ==========================================
        let drawCount = 1; // 1 = Draw 1 (Classic default), 3 = Draw 3

        let gameState = {
            stock: [],
            waste: [],
            foundations: [[], [], [], []], // 4 Foundation piles (any Ace can start any empty pile)
            tableau: [[], [], [], [], [], [], []],
            score: 0,
            moves: 0,
            seconds: 0,
            timerInterval: null,
            gameStarted: false,
            gameWon: false
        };

        let undoStack = [];
        let hintedCardIds = new Set();

        // ==========================================
        // 4. WEB AUDIO SYNTHESIZER, DEALING, SCORING & UNDO
        // ==========================================
        const SoundFX = (() => {
            let ctx = null;
            let muted = false;

            function getCtx() {
                if (!ctx && (window.AudioContext || window.webkitAudioContext)) {
                    ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (ctx && ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }
                return ctx;
            }

            function playTone(freq, type, duration, gainVal = 0.08, slideTo = null) {
                if (muted) return;
                const audioCtx = getCtx();
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    if (slideTo) {
                        osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch (_) {}
            }

            return {
                isMuted: () => muted,
                toggleMute: () => {
                    muted = !muted;
                    return muted;
                },
                cardFlip: () => playTone(460, 'triangle', 0.07, 0.06, 680),
                cardPlace: () => playTone(260, 'sine', 0.09, 0.08, 170),
                foundation: () => {
                    playTone(523.25, 'triangle', 0.11, 0.09, 783.99);
                    setTimeout(() => playTone(783.99, 'triangle', 0.14, 0.08, 1046.5), 55);
                },
                hint: () => playTone(660, 'sine', 0.14, 0.07, 880),
                error: () => playTone(165, 'sawtooth', 0.12, 0.05, 115),
                win: () => {
                    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
                    notes.forEach((n, idx) => {
                        setTimeout(() => playTone(n, 'triangle', 0.22, 0.09), idx * 95);
                    });
                }
            };
        })();

        function toggleSound() {
            const isMuted = SoundFX.toggleMute();
            const icon = document.getElementById('sound-icon');
            if (icon) icon.textContent = isMuted ? '🔇' : '🔊';
        }

        function toggleDrawMode() {
            drawCount = drawCount === 1 ? 3 : 1;
            const btn = document.getElementById('btn-draw-mode');
            if (btn) btn.textContent = `DRAW ${drawCount}`;
            startNewGame();
        }

        function addScore(delta) {
            gameState.score = Math.max(0, gameState.score + delta);
        }

        function ensureTimerRunning() {
            if (gameState.gameStarted || gameState.gameWon) return;
            gameState.gameStarted = true;
            gameState.timerInterval = setInterval(() => {
                if (!gameState.gameWon) {
                    gameState.seconds++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function saveSnapshot() {
            const cloneCards = (arr) => arr.map(c => ({ ...c }));
            undoStack.push({
                stock: cloneCards(gameState.stock),
                waste: cloneCards(gameState.waste),
                foundations: gameState.foundations.map(cloneCards),
                tableau: gameState.tableau.map(cloneCards),
                score: gameState.score,
                moves: gameState.moves
            });
            if (undoStack.length > 60) {
                undoStack.shift();
            }
        }

        function undoMove() {
            if (undoStack.length === 0 || gameState.gameWon) return;
            const prev = undoStack.pop();
            gameState.stock = prev.stock;
            gameState.waste = prev.waste;
            gameState.foundations = prev.foundations;
            gameState.tableau = prev.tableau;
            gameState.score = prev.score;
            gameState.moves = prev.moves;
            hintedCardIds.clear();
            SoundFX.cardFlip();
            updateHUD();
            renderBoard();
            checkAutoCompleteAvailability();
        }

        function createShuffledDeck() {
            const deck = [];
            for (const suit of SUITS) {
                const color = (suit === 'hearts' || suit === 'diamonds') ? 'red' : 'black';
                for (const r of RANKS) {
                    deck.push({
                        id: `${r.label}-${suit}`,
                        suit,
                        color,
                        value: r.val,
                        label: r.label,
                        faceUp: false
                    });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function startNewGame() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }

            const deck = createShuffledDeck();
            const tableau = [[], [], [], [], [], [], []];

            // Classic Klondike 28-card deal: col i gets (i + 1) cards, top card face-up
            for (let col = 0; col < 7; col++) {
                for (let row = 0; row <= col; row++) {
                    const card = deck.pop();
                    card.faceUp = (row === col);
                    tableau[col].push(card);
                }
            }

            gameState = {
                stock: deck, // Remaining 24 cards face-down
                waste: [],
                foundations: [[], [], [], []],
                tableau,
                score: 0,
                moves: 0,
                seconds: 0,
                timerInterval: null,
                gameStarted: false,
                gameWon: false
            };

            undoStack = [];
            hintedCardIds.clear();

            const winOverlay = document.getElementById('victory-overlay');
            if (winOverlay) winOverlay.classList.add('hidden');
            const autoBtn = document.getElementById('btn-autocomplete');
            if (autoBtn) autoBtn.classList.add('hidden');

            updateHUD();
            renderBoard();
        }

        // ==========================================
        // 5. POP ART ACTION CALLOUTS (STYLE-ADAPTIVE)
        // ==========================================
        function spawnCallout(text, x, y, forcedColor = null) {
            const cfg = ART_STYLES[currentArtStyle] || ART_STYLES.comic;

                            <rect x="20" y="30" width="120" height="60" fill="none" stroke="#0D0D0D" stroke-width="2.5" stroke-dasharray="6 4"/>`;

                shapeSVG = `<rect x="14" y="24" width="132" height="72" rx="36" transform="rotate(-6 80 60)" fill="${bgColor}" stroke="#0D0D0D" stroke-width="5"/>`;
            } else if (currentArtStyle === 'street') {

            } else if (currentArtStyle === 'manga') {
                shapeSVG = `<polygon points="80,2 96,28 134,8 122,42 158,56 122,74 140,108 98,92 80,118 62,92 20,108 38,74 2,56 38,42 26,8 64,28" fill="${bgColor}" stroke="#1E1B4B" stroke-width="5" stroke-linejoin="round"/>`;
            } else {
                shapeSVG = `<polygon points="80,4 100,26 138,14 128,46 156,64 124,80 134,110 98,96 80,116 62,96 26,110 36,80 4,64 32,46 22,14 60,26" fill="${bgColor}" stroke="#0D0D0D" stroke-width="5" stroke-linejoin="round"/>`;

                          fill="${textColor}" stroke="#0D0D0D" stroke-width="${textColor === '#FFFFFF' ? '2' : '0'}">${word}</text>
                </svg>
            `;

            setTimeout(() => el.remove(), 860);
        }

        // ==========================================
        // 6. CLASSIC KLONDIKE RULES & VALIDATION
        // ==========================================

        /**
         * Classic Klondike Foundation Rule:
         * - Empty foundation pile accepts ONLY an Ace (value === 1) of ANY suit.
         * - Non-empty foundation pile accepts ONLY the next ascending rank (+1)
         *   of the EXACT SAME SUIT as the top card on that foundation pile.
         */
        function canMoveToFoundation(card, foundationIndex) {
            const pile = gameState.foundations[foundationIndex];
            if (pile.length === 0) {
                return card.value === 1; // Any Ace starts an empty foundation
            }
            const topCard = pile[pile.length - 1];
            return (card.suit === topCard.suit) && (card.value === topCard.value + 1);
        }

        /**
         * Finds the best valid foundation index for a single card, or -1 if none exists.
         * Prefers matching an existing suit pile first, then the first empty foundation slot for an Ace.
         */
        function findValidFoundationIndex(card) {
            if (card.value === 1) {
                return gameState.foundations.findIndex(pile => pile.length === 0);
            }
            return gameState.foundations.findIndex(pile => {
                if (pile.length === 0) return false;
                const top = pile[pile.length - 1];
                return top.suit === card.suit && card.value === top.value + 1;
            });
        }

        /**
         * Classic Klondike Tableau Rule:
         * - Empty tableau column accepts ONLY a King (value === 13) (or King-led face-up stack).
         * - Non-empty tableau column accepts ONLY a card whose color is OPPOSITE to the
         *   column's bottom-most face-up card AND whose rank is EXACTLY 1 LESS (target.value - 1).
         */
        function canMoveToTableau(card, colIndex) {
            const col = gameState.tableau[colIndex];
            if (col.length === 0) {
                return card.value === 13; // Strictly Kings only on empty columns
            }
            const topCard = col[col.length - 1];
            if (!topCard.faceUp) return false;
            return (card.color !== topCard.color) && (card.value === topCard.value - 1);
        }

        /**
         * Validates that a sub-stack of cards in a Tableau column is a legal face-up descending
         * alternating-color sequence before allowing it to be moved.
         */
        function isValidTableauSubStack(cards) {
            if (cards.length === 0) return false;
            if (!cards[0].faceUp) return false;
            for (let i = 1; i < cards.length; i++) {
                if (!cards[i].faceUp) return false;
                if (cards[i].color === cards[i - 1].color) return false;
                if (cards[i].value !== cards[i - 1].value - 1) return false;
            }
            return true;
        }

        function handleStockClick() {
            if (gameState.gameWon) return;
            ensureTimerRunning();
            hintedCardIds.clear();

            if (gameState.stock.length > 0) {
                saveSnapshot();
                const toDraw = Math.min(drawCount, gameState.stock.length);
                for (let i = 0; i < toDraw; i++) {
                    const card = gameState.stock.pop();
                    card.faceUp = true;
                    gameState.waste.push(card);
                }
                gameState.moves++;
                SoundFX.cardFlip();
            } else if (gameState.waste.length > 0) {
                saveSnapshot();
                // Recycle entire waste pile back into face-down stock preserving exact draw order
                while (gameState.waste.length > 0) {
                    const card = gameState.waste.pop();
                    card.faceUp = false;
                    gameState.stock.push(card);
                }
                // Standard Klondike waste recycle penalty (-100 pts, min 0)
                addScore(-100);
                gameState.moves++;
                SoundFX.cardFlip();
            }
            updateHUD();
            renderBoard();
        }

        function executeMove(sourceInfo, targetInfo, eventCoords = null) {
            // sourceInfo: { type: 'waste'|'tableau'|'foundation', colIndex, cardIndex }
            // targetInfo: { type: 'foundation'|'tableau', index }
            let movingCards = [];

            if (sourceInfo.type === 'waste') {
                if (gameState.waste.length === 0) return false;
                // Strictly only the TOP card of the Waste pile can be played
                if (sourceInfo.cardIndex !== undefined && sourceInfo.cardIndex !== gameState.waste.length - 1) {
                    return false;
                }
                movingCards = [gameState.waste[gameState.waste.length - 1]];
            } else if (sourceInfo.type === 'foundation') {
                const pile = gameState.foundations[sourceInfo.colIndex];
                if (pile.length === 0) return false;
                movingCards = [pile[pile.length - 1]];
            } else if (sourceInfo.type === 'tableau') {
                const col = gameState.tableau[sourceInfo.colIndex];
                movingCards = col.slice(sourceInfo.cardIndex);
                if (!isValidTableauSubStack(movingCards)) return false;
            }

            if (movingCards.length === 0) return false;
            const leadCard = movingCards[0];

            // Validate target
            if (targetInfo.type === 'foundation') {
                if (movingCards.length !== 1) return false; // Only a single top card can move to a Foundation
                if (sourceInfo.type === 'foundation' && sourceInfo.colIndex === targetInfo.index) return false;
                if (!canMoveToFoundation(leadCard, targetInfo.index)) return false;
            } else if (targetInfo.type === 'tableau') {
                if (sourceInfo.type === 'tableau' && sourceInfo.colIndex === targetInfo.index) return false;
                if (!canMoveToTableau(leadCard, targetInfo.index)) return false;
            } else {
                return false;
            }

            // Valid move! Record snapshot & execute
            ensureTimerRunning();
            saveSnapshot();
            hintedCardIds.clear();

            // Remove from source
            if (sourceInfo.type === 'waste') {
                gameState.waste.pop();
            } else if (sourceInfo.type === 'foundation') {
                gameState.foundations[sourceInfo.colIndex].pop();
            } else if (sourceInfo.type === 'tableau') {
                gameState.tableau[sourceInfo.colIndex].splice(sourceInfo.cardIndex);
            }

            // Add to target & apply Classic Klondike Scoring
            let revealedNewCard = false;
            if (targetInfo.type === 'foundation') {
                gameState.foundations[targetInfo.index].push(leadCard);
                if (sourceInfo.type === 'waste' || sourceInfo.type === 'tableau') {
                    addScore(10); // Waste/Tableau -> Foundation: +10
                }
                SoundFX.foundation();
            } else {
                gameState.tableau[targetInfo.index].push(...movingCards);
                if (sourceInfo.type === 'waste') {
                    addScore(5); // Waste -> Tableau: +5
                } else if (sourceInfo.type === 'foundation') {
                    addScore(-15); // Foundation -> Tableau pullback: -15
                }
                SoundFX.cardPlace();
            }

            // Flip newly exposed face-down tableau card if needed (+5 points)
            if (sourceInfo.type === 'tableau') {
                const srcCol = gameState.tableau[sourceInfo.colIndex];
                if (srcCol.length > 0 && !srcCol[srcCol.length - 1].faceUp) {
                    srcCol[srcCol.length - 1].faceUp = true;
                    revealedNewCard = true;
                    addScore(5);
                }
            }

            gameState.moves++;

            // Trigger Pop Art visual burst on exciting moves
            const cx = eventCoords ? eventCoords.x : window.innerWidth / 2;
            const cy = eventCoords ? eventCoords.y : window.innerHeight / 2;
            if (targetInfo.type === 'foundation') {
                const label = leadCard.value === 1 ? 'ACE!' : (leadCard.value === 13 ? 'KING!' : 'POW!');
                spawnCallout(label, cx, cy, '#FFE600');
            } else if (revealedNewCard) {
                spawnCallout('FLIP!', cx, cy, '#00FF66');
            } else if (leadCard.value === 13 && targetInfo.type === 'tableau') {
                spawnCallout('KING!', cx, cy, '#00D2FF');
            }

            updateHUD();
            renderBoard();
            checkAutoCompleteAvailability();
            checkWinCondition();
            return true;
        }

        /**
         * Smart Tap / Click Auto-Move:
         * Automatically finds the best legal move for a clicked card/stack:
         * 1. If it's a single top card, tries a valid Foundation pile first.
         * 2. Otherwise tries valid Tableau columns (preferring non-empty columns first so Kings
         *    don't needlessly hop between empty columns, unless moving off a face-down card).
         */
        function smartAutoMove(sourceInfo, coords) {
            let movingCards = [];
            if (sourceInfo.type === 'waste') {
                if (gameState.waste.length === 0) return false;
                movingCards = [gameState.waste[gameState.waste.length - 1]];
            } else if (sourceInfo.type === 'tableau') {
                const col = gameState.tableau[sourceInfo.colIndex];
                movingCards = col.slice(sourceInfo.cardIndex);
                if (!isValidTableauSubStack(movingCards)) return false;
            } else if (sourceInfo.type === 'foundation') {
                const pile = gameState.foundations[sourceInfo.colIndex];
                if (pile.length === 0) return false;
                movingCards = [pile[pile.length - 1]];
            }

            if (movingCards.length === 0) return false;
            const leadCard = movingCards[0];

            // 1. Try Foundation (only for single cards not already on foundation)
            if (movingCards.length === 1 && sourceInfo.type !== 'foundation') {
                const fIdx = findValidFoundationIndex(leadCard);
                if (fIdx !== -1) {
                    return executeMove(sourceInfo, { type: 'foundation', index: fIdx }, coords);
                }
            }

            // 2. Try Tableau columns (prefer non-empty target columns first)
            const nonEmptyCols = [];
            const emptyCols = [];
            for (let c = 0; c < 7; c++) {
                if (sourceInfo.type === 'tableau' && sourceInfo.colIndex === c) continue;
                if (canMoveToTableau(leadCard, c)) {
                    if (gameState.tableau[c].length > 0) {
                        nonEmptyCols.push(c);
                    } else {
                        emptyCols.push(c);
                    }
                }
            }

            if (nonEmptyCols.length > 0) {
                return executeMove(sourceInfo, { type: 'tableau', index: nonEmptyCols[0] }, coords);
            }

            // Only auto-move a King to an empty column if it frees a face-down card or comes from Waste/Foundation
            if (emptyCols.length > 0) {
                const freesFaceDown = sourceInfo.type === 'tableau' &&
                    sourceInfo.cardIndex > 0 &&
                    !gameState.tableau[sourceInfo.colIndex][sourceInfo.cardIndex - 1].faceUp;
                if (sourceInfo.type !== 'tableau' || freesFaceDown) {
                    return executeMove(sourceInfo, { type: 'tableau', index: emptyCols[0] }, coords);
                }
            }

            return false;
        }

        /**
         * Hint System: Highlights the highest-value legal move available on the board
         */
        function showHint() {
            if (gameState.gameWon) return;
            hintedCardIds.clear();

            // 1. Check Waste top card -> Foundation or Tableau
            if (gameState.waste.length > 0) {
                const wCard = gameState.waste[gameState.waste.length - 1];
                if (findValidFoundationIndex(wCard) !== -1) {
                    hintedCardIds.add(wCard.id);
                    SoundFX.hint();
                    renderBoard();
                    return;
                }
                for (let c = 0; c < 7; c++) {
                    if (canMoveToTableau(wCard, c)) {
                        hintedCardIds.add(wCard.id);
                        SoundFX.hint();
                        renderBoard();
                        return;
                    }
                }
            }

            // 2. Check Tableau top cards -> Foundation
            for (let c = 0; c < 7; c++) {
                const col = gameState.tableau[c];
                if (col.length > 0) {
                    const topCard = col[col.length - 1];
                    if (findValidFoundationIndex(topCard) !== -1) {
                        hintedCardIds.add(topCard.id);
                        SoundFX.hint();
                        renderBoard();
                        return;
                    }
                }
            }

            // 3. Check Tableau face-up stacks -> other Tableau columns (that reveal a face-down card or clear a slot)
            for (let c = 0; c < 7; c++) {
                const col = gameState.tableau[c];
                const firstFaceUpIdx = col.findIndex(card => card.faceUp);
                if (firstFaceUpIdx === -1) continue;
                const leadCard = col[firstFaceUpIdx];
                // Skip moving a King from the bottom of a column to another empty column
                if (leadCard.value === 13 && firstFaceUpIdx === 0) continue;

                for (let targetC = 0; targetC < 7; targetC++) {
                    if (c === targetC) continue;
                    if (canMoveToTableau(leadCard, targetC)) {
                        for (let k = firstFaceUpIdx; k < col.length; k++) {
                            hintedCardIds.add(col[k].id);
                        }
                        SoundFX.hint();
                        renderBoard();
                        return;
                    }
                }
            }

            // 4. Suggest clicking Stock if cards remain
            if (gameState.stock.length > 0 || gameState.waste.length > 0) {
                const stockSlot = document.getElementById('stock-slot');
                const rect = stockSlot.getBoundingClientRect();
                spawnCallout('DRAW!', rect.left + rect.width / 2, rect.top + rect.height / 2, '#00D2FF');
                SoundFX.hint();
            } else {
                spawnCallout('STUCK!', window.innerWidth / 2, window.innerHeight / 2, '#FF1E42');
                SoundFX.error();
            }
        }

        function checkAutoCompleteAvailability() {
            if (gameState.gameWon) return;
            // Available ONLY when Stock & Waste are completely empty and every Tableau card is face-up
            if (gameState.stock.length === 0 && gameState.waste.length === 0) {
                const allFaceUp = gameState.tableau.every(col => col.every(c => c.faceUp));
                const totalRemaining = gameState.tableau.reduce((acc, col) => acc + col.length, 0);
                if (allFaceUp && totalRemaining > 0) {
                    document.getElementById('btn-autocomplete').classList.remove('hidden');
                    return;
                }
            }
            document.getElementById('btn-autocomplete').classList.add('hidden');
        }

        function triggerAutoComplete() {
            document.getElementById('btn-autocomplete').classList.add('hidden');
            const step = () => {
                if (gameState.gameWon) return;
                let moved = false;
                for (let c = 0; c < 7; c++) {
                    const col = gameState.tableau[c];
                    if (col.length > 0) {
                        const topCard = col[col.length - 1];
                        const fIdx = findValidFoundationIndex(topCard);
                        if (fIdx !== -1) {
                            const el = document.getElementById(`tableau-${c}`);
                            const rect = el.getBoundingClientRect();
                            executeMove(
                                { type: 'tableau', colIndex: c, cardIndex: col.length - 1 },
                                { type: 'foundation', index: fIdx },
                                { x: rect.left + rect.width / 2, y: rect.top + 60 }
                            );
                            moved = true;
                            break;
                        }
                    }
                }
                if (moved && !gameState.gameWon) {
                    setTimeout(step, 100);
                }
            };
            step();
        }

        function checkWinCondition() {
            const totalInFoundations = gameState.foundations.reduce((sum, pile) => sum + pile.length, 0);
            if (totalInFoundations === 52 && !gameState.gameWon) {
                gameState.gameWon = true;
                clearInterval(gameState.timerInterval);
                document.getElementById('btn-autocomplete').classList.add('hidden');
                SoundFX.win();
                spawnCallout('VICTORY!', window.innerWidth / 2, window.innerHeight / 2, '#FF1E42');
                setTimeout(() => {
                    document.getElementById('win-score').textContent = gameState.score;
                    document.getElementById('win-moves').textContent = gameState.moves;
                    document.getElementById('win-time').textContent = formatTime(gameState.seconds);
                    document.getElementById('victory-overlay').classList.remove('hidden');
                }, 650);
            }
        }

        // ==========================================
        // 7. RENDERING & INTERACTION (DRAG + SMART TAP)
        // ==========================================
        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerDisplay() {
            document.getElementById('timer-display').textContent = formatTime(gameState.seconds);
        }

        function updateHUD() {
            document.getElementById('score-display').textContent = gameState.score;
            document.getElementById('move-count').textContent = gameState.moves;
            updateTimerDisplay();
            document.getElementById('btn-undo').disabled = undoStack.length === 0;
        }

        function createCardElement(card, sourceInfo, isPlayable = true) {
            const el = document.createElement('div');
            el.className = 'playing-card';
            el.dataset.cardId = card.id;

            if (hintedCardIds.has(card.id)) {
                el.classList.add('hint-card');
            }

            // Face-down cards cannot be moved, dragged, or selected
            if (!card.faceUp) {
                el.style.cursor = 'default';
                el.innerHTML = `
                    <div class="card-back back-${currentArtStyle}">
                        <div class="card-back-inner">
                            ${getCardBackInnerSVG()}
                        </div>
                    </div>
                `;
                return el;
            }

            const isRed = card.color === 'red';
            const colorClass = isRed ? 'suit-red' : 'suit-black';
            const isFace = card.value >= 11;

            const centerGraphic = isFace
                ? getFaceCardCenterSVG(card.label, card.suit)
                : `<div class="w-[52%] h-[52%]">${getSuitSVG(card.suit)}</div>`;

            el.innerHTML = `
                <div class="card-front style-${currentArtStyle} ${isRed ? 'is-red' : ''}">
                    <div class="card-corner ${colorClass}">
                        <span class="card-rank">${card.label}</span>
                        <div class="card-mini-suit">${getSuitSVG(card.suit)}</div>
                    </div>
                    <div class="card-center-art">
                        ${centerGraphic}
                    </div>
                    <div class="card-corner card-corner-bottom ${colorClass}">
                        <span class="card-rank">${card.label}</span>
                        <div class="card-mini-suit">${getSuitSVG(card.suit)}</div>
                    </div>
                </div>
            `;

            if (isPlayable) {
                attachCardInteractions(el, card, sourceInfo);
            } else {
                el.style.cursor = 'default';
            }
            return el;
        }

        function renderBoard() {
            // 1. Render Stock
            const stockSlot = document.getElementById('stock-slot');
            Array.from(stockSlot.querySelectorAll('.playing-card')).forEach(n => n.remove());
            if (gameState.stock.length > 0) {
                const topStock = gameState.stock[gameState.stock.length - 1];
                const cardEl = createCardElement(topStock, { type: 'stock' }, false);
                cardEl.style.cursor = 'pointer';
                if (gameState.stock.length > 8) {
                    cardEl.style.boxShadow = '2px 2px 0 #FFFFFF, 4px 4px 0 #0D0D0D, 6px 6px 0 #FFE600, 8px 8px 0 #0D0D0D';
                }
                stockSlot.appendChild(cardEl);
            }

            // 2. Render Waste (in Draw 3 mode, fan up to 3 top cards; ONLY the top-most card is playable)
            const wasteSlot = document.getElementById('waste-slot');
            wasteSlot.innerHTML = '';
            if (gameState.waste.length > 0) {
                const visibleCount = drawCount === 3 ? Math.min(3, gameState.waste.length) : 1;
                const startIdx = gameState.waste.length - visibleCount;
                const cardW = wasteSlot.clientWidth || 80;
                const fanStep = Math.min(20, Math.round(cardW * 0.24));

                for (let i = startIdx; i < gameState.waste.length; i++) {
                    const isTopWasteCard = (i === gameState.waste.length - 1);
                    const fanOffset = (i - startIdx) * fanStep;
                    const cardEl = createCardElement(
                        gameState.waste[i],
                        { type: 'waste', colIndex: 0, cardIndex: i },
                        isTopWasteCard
                    );
                    cardEl.style.left = `${fanOffset}px`;
                    cardEl.style.zIndex = `${i + 1}`;
                    wasteSlot.appendChild(cardEl);
                }
            }

            // 3. Render Foundations
            for (let i = 0; i < 4; i++) {
                const fSlot = document.getElementById(`foundation-${i}`);
                Array.from(fSlot.querySelectorAll('.playing-card')).forEach(n => n.remove());
                const pile = gameState.foundations[i];
                if (pile.length > 0) {
                    const topCard = pile[pile.length - 1];
                    const cardEl = createCardElement(
                        topCard,
                        { type: 'foundation', colIndex: i, cardIndex: pile.length - 1 },
                        true
                    );
                    fSlot.appendChild(cardEl);
                }
            }

            // 4. Render Tableau Columns with dynamic vertical compression
            const boardHeight = document.getElementById('game-board').clientHeight;
            const topRowHeight = document.querySelector('.top-row').clientHeight;
            const cardHeight = document.getElementById('stock-slot').clientHeight || 110;
            const availTableauHeight = Math.max(220, boardHeight - topRowHeight - 36);

            for (let colIdx = 0; colIdx < 7; colIdx++) {
                const colEl = document.getElementById(`tableau-${colIdx}`);
                Array.from(colEl.querySelectorAll('.playing-card')).forEach(n => n.remove());

                const cards = gameState.tableau[colIdx];
                if (cards.length === 0) continue;

                const defaultFaceDownOffset = Math.max(11, Math.min(20, cardHeight * 0.16));
                const defaultFaceUpOffset = Math.max(20, Math.min(34, cardHeight * 0.27));

                let totalNeeded = cardHeight;
                for (let k = 0; k < cards.length - 1; k++) {
                    totalNeeded += cards[k].faceUp ? defaultFaceUpOffset : defaultFaceDownOffset;
                }

                const scaleFactor = totalNeeded > availTableauHeight
                    ? Math.max(0.45, (availTableauHeight - cardHeight) / (totalNeeded - cardHeight))
                    : 1;

                let currentY = 0;
                cards.forEach((card, cardIdx) => {
                    const cardEl = createCardElement(
                        card,
                        { type: 'tableau', colIndex: colIdx, cardIndex: cardIdx },
                        card.faceUp
                    );
                    cardEl.style.top = `${Math.round(currentY)}px`;
                    cardEl.style.zIndex = `${cardIdx + 1}`;
                    colEl.appendChild(cardEl);

                    currentY += (card.faceUp ? defaultFaceUpOffset : defaultFaceDownOffset) * scaleFactor;
                });
            }
        }

        // ==========================================
        // 8. POINTER DRAG-AND-DROP & SMART TAP HANDLERS
        // ==========================================
        function attachCardInteractions(cardEl, card, sourceInfo) {
            cardEl.addEventListener('pointerdown', (e) => {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                if (gameState.gameWon || !card.faceUp) return;
                e.stopPropagation();

                const startX = e.clientX;
                const startY = e.clientY;
                let isDragging = false;
                let dragGroup = [];
                let initialOffsets = [];

                // Gather stack of cards that move together
                if (sourceInfo.type === 'tableau') {
                    const colEl = document.getElementById(`tableau-${sourceInfo.colIndex}`);
                    const allColCards = Array.from(colEl.querySelectorAll('.playing-card'));
                    dragGroup = allColCards.slice(sourceInfo.cardIndex);
                } else {
                    dragGroup = [cardEl];
                }

                dragGroup.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    initialOffsets.push({
                        el,
                        offsetX: startX - rect.left,
                        offsetY: startY - rect.top,
                        origParent: el.parentElement,
                        origTop: el.style.top,
                        origLeft: el.style.left,
                        origZ: el.style.zIndex
                    });
                });

                const onPointerMove = (moveEvent) => {
                    const dx = moveEvent.clientX - startX;
                    const dy = moveEvent.clientY - startY;

                    // Distinguish intentional drag (> 6px) from clean click/tap (<= 6px)
                    if (!isDragging && Math.hypot(dx, dy) > 6) {
                        isDragging = true;
                        hintedCardIds.clear();
                        initialOffsets.forEach((item, idx) => {
                            item.el.classList.add('dragging');
                            item.el.style.position = 'fixed';
                            item.el.style.zIndex = `${9000 + idx}`;
                            document.body.appendChild(item.el);
                        });
                    }

                    if (isDragging) {
                        initialOffsets.forEach((item) => {
                            item.el.style.left = `${moveEvent.clientX - item.offsetX}px`;
                            item.el.style.top = `${moveEvent.clientY - item.offsetY}px`;
                        });
                        highlightDropTarget(moveEvent.clientX, moveEvent.clientY, card, dragGroup.length);
                    }
                };

                const onPointerUp = (upEvent) => {
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    clearDropHighlights();

                    if (isDragging) {
                        // Restore DOM nodes before re-rendering
                        initialOffsets.forEach(item => {
                            item.el.classList.remove('dragging');
                            item.el.style.position = 'absolute';
                            item.el.style.left = item.origLeft;
                            item.el.style.top = item.origTop;
                            item.el.style.zIndex = item.origZ;
                            item.origParent.appendChild(item.el);
                        });

                        const target = findDropTarget(upEvent.clientX, upEvent.clientY);
                        if (target) {
                            const success = executeMove(sourceInfo, target, { x: upEvent.clientX, y: upEvent.clientY });
                            if (!success) {
                                SoundFX.error();
                                renderBoard();
                            }
                        } else {
                            renderBoard();
                        }
                    } else {
                        // Clean tap/click (<= 6px movement): smart auto-move to best legal destination
                        const moved = smartAutoMove(sourceInfo, { x: upEvent.clientX, y: upEvent.clientY });
                        if (!moved) {
                            SoundFX.error();
                        }
                    }
                };

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });
        }

        function findDropTarget(x, y) {
            // Check foundations first
            for (let i = 0; i < 4; i++) {
                const rect = document.getElementById(`foundation-${i}`).getBoundingClientRect();
                if (x >= rect.left - 10 && x <= rect.right + 10 && y >= rect.top - 10 && y <= rect.bottom + 10) {
                    return { type: 'foundation', index: i };
                }
            }
            // Check tableau columns
            for (let i = 0; i < 7; i++) {
                const rect = document.getElementById(`tableau-${i}`).getBoundingClientRect();
                if (x >= rect.left - 8 && x <= rect.right + 8 && y >= rect.top - 10 && y <= rect.bottom + 20) {
                    return { type: 'tableau', index: i };
                }
            }
            return null;
        }

        function highlightDropTarget(x, y, leadCard, stackCount) {
            clearDropHighlights();
            const target = findDropTarget(x, y);
            if (!target) return;

            if (target.type === 'foundation' && stackCount === 1 && canMoveToFoundation(leadCard, target.index)) {
                document.getElementById(`foundation-${target.index}`).classList.add('highlight-target');
            } else if (target.type === 'tableau' && canMoveToTableau(leadCard, target.index)) {
                const col = document.getElementById(`tableau-${target.index}`);
                const cards = col.querySelectorAll('.playing-card');
                if (cards.length > 0) {
                    cards[cards.length - 1].classList.add('highlight-target');
                } else {
                    col.querySelector('.tableau-base-slot').classList.add('highlight-target');
                }
            }
        }

        function clearDropHighlights() {
            document.querySelectorAll('.highlight-target').forEach(el => el.classList.remove('highlight-target'));
        }

        // Boot game on window load
        window.onload = function () {
            window.addEventListener('resize', () => {
                renderBoard();
            });

            renderBackdropArt();
            startNewGame();
        };
    </script>
</body>
