                const colEl = document.getElementById(`tableau-${colIdx}`);
                Array.from(colEl.querySelectorAll('.playing-card')).forEach(n => n.remove());

                const cards = gameState.tableau[colIdx];
                if (cards.length === 0) continue;

                const defaultFaceDownOffset = Math.max(11, Math.min(20, cardHeight * 0.16));
                const defaultFaceUpOffset = Math.max(20, Math.min(34, cardHeight * 0.27));

                let totalNeeded = cardHeight;
                for (let k = 0; k < cards.length - 1; k++) {
                    totalNeeded += cards[k].faceUp ? defaultFaceUpOffset : defaultFaceDownOffset;
                }

                const scaleFactor = totalNeeded > availTableauHeight
                    ? Math.max(0.45, (availTableauHeight - cardHeight) / (totalNeeded - cardHeight))
                    : 1;

                let currentY = 0;
                cards.forEach((card, cardIdx) => {
                    const cardEl = createCardElement(
                        card,
                        { type: 'tableau', colIndex: colIdx, cardIndex: cardIdx },
                        card.faceUp
                    );
                    cardEl.style.top = `${Math.round(currentY)}px`;
                    cardEl.style.zIndex = `${cardIdx + 1}`;
                    colEl.appendChild(cardEl);

                    currentY += (card.faceUp ? defaultFaceUpOffset : defaultFaceDownOffset) * scaleFactor;
                });
            }
        }

        // ==========================================
        // 8. POINTER DRAG-AND-DROP & SMART TAP HANDLERS
        // ==========================================
        function attachCardInteractions(cardEl, card, sourceInfo) {
            cardEl.addEventListener('pointerdown', (e) => {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                if (gameState.gameWon || !card.faceUp) return;
                e.stopPropagation();

                const startX = e.clientX;
                const startY = e.clientY;
                let isDragging = false;
                let dragGroup = [];
                let initialOffsets = [];

                // Gather stack of cards that move together
                if (sourceInfo.type === 'tableau') {
                    const colEl = document.getElementById(`tableau-${sourceInfo.colIndex}`);
                    const allColCards = Array.from(colEl.querySelectorAll('.playing-card'));
                    dragGroup = allColCards.slice(sourceInfo.cardIndex);
                } else {
                    dragGroup = [cardEl];
                }

                dragGroup.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    initialOffsets.push({
                        el,
                        offsetX: startX - rect.left,
                        offsetY: startY - rect.top,
                        origParent: el.parentElement,
                        origTop: el.style.top,
                        origLeft: el.style.left,
                        origZ: el.style.zIndex
                    });
                });

                const onPointerMove = (moveEvent) => {
                    const dx = moveEvent.clientX - startX;
                    const dy = moveEvent.clientY - startY;

                    // Distinguish intentional drag (> 6px) from clean click/tap (<= 6px)
                    if (!isDragging && Math.hypot(dx, dy) > 6) {
                        isDragging = true;
                        hintedCardIds.clear();
                        initialOffsets.forEach((item, idx) => {
                            item.el.classList.add('dragging');
                            item.el.style.position = 'fixed';
                            item.el.style.zIndex = `${9000 + idx}`;
                            document.body.appendChild(item.el);
                        });
                    }

                    if (isDragging) {
                        initialOffsets.forEach((item) => {
                            item.el.style.left = `${moveEvent.clientX - item.offsetX}px`;
                            item.el.style.top = `${moveEvent.clientY - item.offsetY}px`;
                        });
                        highlightDropTarget(moveEvent.clientX, moveEvent.clientY, card, dragGroup.length);
                    }
                };

                const onPointerUp = (upEvent) => {
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    clearDropHighlights();

                    if (isDragging) {
                        // Restore DOM nodes before re-rendering
                        initialOffsets.forEach(item => {
                            item.el.classList.remove('dragging');
                            item.el.style.position = 'absolute';
                            item.el.style.left = item.origLeft;
                            item.el.style.top = item.origTop;
                            item.el.style.zIndex = item.origZ;
                            item.origParent.appendChild(item.el);
                        });

                        const target = findDropTarget(upEvent.clientX, upEvent.clientY);
                        if (target) {
                            const success = executeMove(sourceInfo, target, { x: upEvent.clientX, y: upEvent.clientY });
                            if (!success) {
                                SoundFX.error();
                                renderBoard();
                            }
                        } else {
                            renderBoard();
                        }
                    } else {
                        // Clean tap/click (<= 6px movement): smart auto-move to best legal destination
                        const moved = smartAutoMove(sourceInfo, { x: upEvent.clientX, y: upEvent.clientY });
                        if (!moved) {
                            SoundFX.error();
                        }
                    }
                };

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });
        }

        function findDropTarget(x, y) {
            // Check foundations first
            for (let i = 0; i < 4; i++) {
                const rect = document.getElementById(`foundation-${i}`).getBoundingClientRect();
                if (x >= rect.left - 10 && x <= rect.right + 10 && y >= rect.top - 10 && y <= rect.bottom + 10) {
                    return { type: 'foundation', index: i };
                }
            }
            // Check tableau columns
            for (let i = 0; i < 7; i++) {
                const rect = document.getElementById(`tableau-${i}`).getBoundingClientRect();
                if (x >= rect.left - 8 && x <= rect.right + 8 && y >= rect.top - 10 && y <= rect.bottom + 20) {
                    return { type: 'tableau', index: i };
                }
            }
            return null;
        }

        function highlightDropTarget(x, y, leadCard, stackCount) {
            clearDropHighlights();
            const target = findDropTarget(x, y);
            if (!target) return;

            if (target.type === 'foundation' && stackCount === 1 && canMoveToFoundation(leadCard, target.index)) {
                document.getElementById(`foundation-${target.index}`).classList.add('highlight-target');
            } else if (target.type === 'tableau' && canMoveToTableau(leadCard, target.index)) {
                const col = document.getElementById(`tableau-${target.index}`);
                const cards = col.querySelectorAll('.playing-card');
                if (cards.length > 0) {
                    cards[cards.length - 1].classList.add('highlight-target');
                } else {
                    col.querySelector('.tableau-base-slot').classList.add('highlight-target');
                }
            }
        }

        function clearDropHighlights() {
            document.querySelectorAll('.highlight-target').forEach(el => el.classList.remove('highlight-target'));
        }

        // Boot game on window load
        window.onload = function () {
            window.addEventListener('resize', () => {
                renderBoard();
            });

            startNewGame();
        };
    </script>
</body>
</html>
