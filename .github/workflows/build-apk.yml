name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build POP! Solitaire APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Build production web app
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: Generate Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android launcher icons and splash screen
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert public/pwa-512x512.png -resize 1024x1024! assets/icon-only.png
          convert public/pwa-maskable-512x512.png -resize 1024x1024! assets/icon-foreground.png
          convert -size 1024x1024 xc:"#00D2FF" assets/icon-background.png
          convert public/pwa-512x512.png -resize 960x960! -gravity center -background "#00D2FF" -extent 2732x2732 assets/splash.png
          npx capacitor-assets generate --android --iconBackgroundColor '#00D2FF' --splashBackgroundColor '#00D2FF'

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for easy download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk POP-Solitaire-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POP-Solitaire-APK
          path: POP-Solitaire-debug.apk
          retention-days: 30
